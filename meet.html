<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Comparison Moved | Rhode Island Elections Project</title>
  <meta name="robots" content="noindex">
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f3f7fb;color:#14213d;display:grid;place-items:center;min-height:100vh}
    .card{max-width:680px;margin:24px;padding:34px;border-radius:24px;background:#fff;border:1px solid #dae4ef;box-shadow:0 18px 45px rgba(18,37,70,.10)}
    h1{margin:0 0 12px;font-size:36px;letter-spacing:-.04em}
    p{color:#62728a;line-height:1.55}
    a{display:inline-block;margin-top:12px;padding:11px 15px;border-radius:999px;background:#101b3b;color:#fff;text-decoration:none;font-weight:800}
  </style>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const next = new URL("running.html", location.href);
      const chamber = params.get("chamber");
      const district = params.get("district");
      if(chamber) next.searchParams.set("chamber", chamber);
      if(district) next.searchParams.set("district", district);
      setTimeout(()=>location.replace(next.href), 250);
    })();
  </script>
</head>
<body>
  <main class="card">
    <h1>Candidate comparison has moved.</h1>
    <p>RIEP now combines “Who's Running?” and “Meet the Candidates” into one Races & Candidates page so voters no longer have to move between two separate tools.</p>
    <a href="running.html">Open Races & Candidates</a>
  </main>
</body>
</html>
