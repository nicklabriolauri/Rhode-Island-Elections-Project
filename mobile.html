<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var forcedView = params.get("view");
    if (forcedView === "mobile") return;

    var prefersDesktopViewport = window.matchMedia("(min-width: 761px)").matches;
    var coarsePointer = window.matchMedia("(pointer: coarse)").matches;
    var narrowScreen = Math.min(window.screen.width || 0, window.screen.height || 0) <= 900;
    var shouldUseDesktop = forcedView === "desktop" || (prefersDesktopViewport && !coarsePointer) || (prefersDesktopViewport && !narrowScreen);
    var isAlreadyDesktop = /(^|\/)index\.html($|[?#])/i.test(window.location.pathname);

    if (shouldUseDesktop && !isAlreadyDesktop) {
      var target = new URL("index.html", window.location.href);
      if (window.location.search) target.search = window.location.search;
      if (window.location.hash) target.hash = window.location.hash;
      window.location.replace(target.toString());
    }
  })();
  </script>
  <meta charset="utf-8" />
  <title>RIEP - Rhode Island Elections Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --navy: #111c3d;
      --navy2: #172554;
      --blue: #2b6cb0;
      --red: #dc2626;
      --gray: #64748b;
      --panel: #f8fafc;
      --line: #e5e7eb;
      --text: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #f8fafc;
      overflow: hidden;
    }
    header {
      padding: 18px 22px;
      color: white;
      background: linear-gradient(135deg, #0f172a 0%, #172554 100%);
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    header p {
      margin: 6px 0 0 0;
      color: rgba(255,255,255,.88);
      line-height: 1.35;
      font-size: 15px;
    }
    .controls {
      height: 62px;
      padding: 11px 22px;
      display: flex;
      gap: 16px;
      align-items: center;
      background: white;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .control-group { display: flex; align-items: center; gap: 8px; }
    .control-label {
      color: var(--gray);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 800;
    }
    .segmented, .year-timeline {
      display: inline-flex;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
    }
    .segmented button, .year-timeline button {
      border: 0;
      background: transparent;
      border-radius: 999px;
      padding: 6px 11px;
      color: #475569;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
      transition: all .15s ease;
    }
    .year-timeline button { padding: 6px 9px; font-size: 12px; }
    .segmented button:hover, .year-timeline button:hover { background: #e2e8f0; }
    .segmented button.active, .year-timeline button.active {
      background: var(--navy2);
      color: white;
      box-shadow: 0 2px 8px rgba(23,37,84,.22);
    }
    select {
      border-radius: 999px;
      padding: 7px 28px 7px 11px;
      border: 1px solid #dbe3ef;
      color: var(--text);
      font-weight: 750;
      background: white;
      font-size: 13px;
    }
    .era-badge {
      margin-left: auto;
      white-space: nowrap;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-weight: 800;
      padding: 6px 11px;
      font-size: 12px;
    }
    .note {
      height: 41px;
      padding: 10px 22px;
      background: #faf7f0;
      border-bottom: 1px solid #ead7b7;
      color: #475569;
      font-size: 13px;
    }
    .dashboard {
      display: grid;
      grid-template-columns: 250px minmax(420px, 1fr) 310px;
      height: calc(100vh - 179px);
      min-height: 560px;
    }
    aside {
      background: var(--panel);
      overflow-y: auto;
    }
    #districtPanel {
      border-right: 1px solid var(--line);
      padding: 10px;
    }
    #factsPanel {
      border-left: 1px solid var(--line);
      padding: 12px;
    }
    .district-panel-title {
      font-size: 14px;
      font-weight: 900;
      margin: 0 0 7px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .district-panel-title::after {
      content: "Click to zoom";
      font-size: 10px;
      color: var(--gray);
      font-weight: 700;
    }
    .district-search {
      width: 100%;
      padding: 8px 9px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      margin-bottom: 8px;
      font-size: 12px;
      background: white;
    }
    .district-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .district-item {
      cursor: pointer;
      border: 1px solid var(--line);
      border-left: 5px solid #999;
      background: white;
      border-radius: 9px;
      padding: 7px 8px;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
    }
    .district-item:hover { background: #f1f5f9; }
    .district-item.active {
      outline: 3px solid rgba(37, 99, 235, 0.22);
      background: #eff6ff;
    }
    .district-item-top {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      color: var(--gray);
      font-size: 9.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 2px;
    }
    .district-item-name {
      font-size: 13px;
      font-weight: 900;
      line-height: 1.15;
      color: var(--text);
    }
    .district-item-detail {
      color: #64748b;
      font-size: 10.5px;
      margin-top: 2px;
    }
    #map {
      position: relative;
      height: 100%;
      width: 100%;
      background: #f8fafc;
    }
    .leaflet-tile-pane {
      filter: grayscale(85%) saturate(70%) contrast(92%);
      opacity: 0.45;
    }
    .facts-title {
      font-size: 18px;
      font-weight: 900;
      margin: 0 0 10px 0;
      letter-spacing: -0.02em;
    }
    .seat-card, .fact-card {
      background: linear-gradient(180deg, #fff 0%, #f8fafc 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(15,23,42,.06);
    }
    .seat-card {
      padding: 10px 12px;
      margin-bottom: 10px;
      text-align: center;
    }
    .seat-title, .fact-label {
      color: #64748b;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 900;
    }
    #seatChart {
      width: 210px;
      height: 104px;
      max-width: 100%;
      display: block;
      margin: 0 auto;
    }
    .seat-labels {
      display: flex;
      justify-content: space-between;
      margin-top: -8px;
      color: #475569;
      font-size: 11px;
    }
    .seat-count {
      display: block;
      font-size: 19px;
      line-height: 1.05;
      color: var(--text);
      font-weight: 900;
    }
    .facts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
    }
    .fact-card {
      padding: 10px 12px;
    }
    .fact-value {
      margin-top: 4px;
      font-size: 20px;
      line-height: 1.12;
      color: var(--text);
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .fact-detail {
      margin-top: 5px;
      font-size: 12px;
      color: #475569;
      line-height: 1.35;
    }
    .legend {
      background: white;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 4px 16px rgba(15,23,42,.14);
      line-height: 1.4;
      font-size: 13px;
    }
    .legend-title { font-weight: 900; margin-bottom: 5px; }
    .swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 6px;
      vertical-align: -2px;
      border: 1px solid rgba(0,0,0,.15);
    }
    .error {
      margin: 12px;
      padding: 12px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #991b1b;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
    }
    @media (max-width: 1000px) {
      body { overflow: auto; }
      .dashboard {
        grid-template-columns: 1fr;
        height: auto;
      }
      #districtPanel { max-height: 280px; }
      #map { height: 520px; }
      #factsPanel { border-left: 0; border-top: 1px solid var(--line); }
      .era-badge { margin-left: 0; }
    }
  
    .site-nav {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .site-nav a {
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 13px;
      font-weight: 800;
      background: rgba(255,255,255,.08);
    }
    .site-nav a:hover {
      background: rgba(255,255,255,.16);
    }


    header {
      padding: 14px 22px;
    }
    header h1 {
      font-size: 25px;
    }
    header p {
      margin-top: 4px;
      font-size: 14px;
    }
    .site-nav {
      margin-top: 8px;
    }
    body.gender-mode .dashboard {
      grid-template-columns: 1fr;
    }
    body.gender-mode #districtPanel,
    body.gender-mode #factsPanel {
      display: none;
    }
    body.gender-mode #map {
      min-height: calc(100vh - 155px);
    }
    .gender-overlay {
      display: none;
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 800;
      width: 300px;
      max-width: calc(100vw - 32px);
      background: rgba(255,255,255,.94);

      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15,23,42,.18);
      padding: 14px;

    body.gender-mode .gender-overlay {
      display: block;
    }
    .gender-overlay-title {
      font-size: 16px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 10px;
    }
    .gender-stat-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .gender-mini-card {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 9px 10px;
    }
    .gender-label {
      color: #64748b;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 900;
    }
    .gender-value {
      color: #0f172a;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-top: 2px;
    }
    .gender-detail {
      color: #475569;
      font-size: 12px;
      line-height: 1.35;
      margin-top: 4px;
    }
    .gender-bar {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0 10px 0;
    }
    .gender-bar-fill {
      height: 100%;
      background: #7c3aed;
      border-radius: 999px;
    }
    .gender-party-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #334155;
      font-size: 12px;
      padding: 4px 0;
      border-top: 1px solid #eef2f7;
    }
    .gender-party-row:first-of-type {
      border-top: 0;
    }
    .gender-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-right: 6px;
      vertical-align: -1px;
    }
    @media (max-width: 800px) {
      body.gender-mode #map {
        min-height: 620px;
      }
      .gender-overlay {
        position: static;
        width: auto;
        margin: 10px;
        max-width: none;
      }
      body.gender-mode .dashboard {
        display: flex;
        flex-direction: column;
      }
      body.gender-mode #map {
        order: 1;
      }
      body.gender-mode .gender-overlay {
        order: 0;
      }
    }


    /* Viewport-fit fix: prevent top/bottom cutoff on laptops and mobile browsers */
    html, body {
      height: 100%;
    }
    body {
      overflow: auto;
    }
    header {
      padding: 10px 22px;
    }
    header h1 {
      font-size: 23px;
      line-height: 1.12;
    }
    header p {

    .site-nav {

    #map {

    }
    body.gender-mode #map {
      min-height: calc(100dvh - 150px);
    }
    @supports not (height: 100dvh) {

      }
      body.gender-mode #map {
        min-height: calc(100vh - 150px);
      }
    }
    @media (max-height: 760px) {

      }
      header h1 {

      }
      header p {

      }
      .site-nav {
        margin-top: 5px;
      }
      .controls {
        padding: 7px 20px;
      }
      .note {
        padding: 7px 20px;
        font-size: 12px;
      }
      .dashboard {
        height: calc(100dvh - 134px);
        min-height: 420px;
      }
      body.gender-mode #map {
        min-height: calc(100dvh - 134px);
      }

    .gender-label {

    .category-filter-row {

    .category-filter-row:hover {

    }
    .category-filter-row.active {
      background: #fff7ed;
      outline: 2px solid #fed7aa;
    }
    .filter-clear {
      display: inline-block;
      margin-top: 8px;
      border: 1px solid #dbe3ef;

      color: #334155;

    }
    .filter-clear:hover {

    }
    .method-note {

      font-size: 11.5px;
      line-height: 1.35;
    }
    .uncontested-overlay-card {
      background: rgba(255,255,255,.94);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15,23,42,.18);
      padding: 14px;
      backdrop-filter: blur(8px);
    }


    /* Compact analytical panels */

      width: 330px;

      padding: 7px 8px;

    .gender-overlay.compact-competitiveness .gender-value {

    body.uncontested-focus .dashboard {
      grid-template-columns: 1fr;
    }
    body.uncontested-focus #districtPanel,
    body.uncontested-focus #factsPanel {
      display: none;
    }
    body.uncontested-focus #map {
      min-height: calc(100dvh - 150px);
    }
    .uncontested-map-overlay {
      display: none;
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 800;
      width: 330px;
      max-width: calc(100vw - 32px);
      max-height: calc(100dvh - 180px);

      background: rgba(255,255,255,.94);

      border-radius: 16px;

function getEra(year) {
  return Number(year) <= 2020 ? "old" : "new";
}

function getGeoKey(chamber, year) {
  return `${chamber}_${getEra(year)}`;
}

function normalizeDistrict(value) {
  return Number(String(value).replace(/^0+/, ""));
}

function getFeatureDistrict(feature) {
  const p = feature.properties || {};
  const raw = p.district_number ?? p.DIST_NUM ?? p.SLDUST ?? p.DISTRICT ?? p.District ?? p.NAME ?? p.NAMELSAD;
  const match = String(raw).match(/\d+/);
  return match ? Number(match[0]) : null;
}

function getRace(chamber, year, district) {
  return raceData[`${chamber}|${year}|${Number(district)}`];
}

function getGenderRecord(chamber, year, district) {
  return genderParityData[`${chamber}|${year}|${Number(district)}`];
}

function isWomanHeldSeat(chamber, year, district) {
  const record = getGenderRecord(chamber, year, district);
  return record && record.is_woman === true;
}

function parseNumber(value) {
  if (value === null || value === undefined || value === "") return NaN;
  if (typeof value === "number") return value;
  return Number(String(value).replace(/,/g, "").replace(/%/g, ""));
}

function competitivenessCategory(race) {
  if (!race) return "unknown";
  if (race.is_uncontested) return "uncontested";
  const margin = Math.abs(parseNumber(race.margin_pct));
  if (Number.isNaN(margin)) return "unknown";
  if (margin < 5) return "tossup";
  if (margin < 10) return "competitive";
  if (margin < 20) return "lean";
  if (margin < 35) return "likely";
  return "safe";
}

function competitivenessLabel(category) {
  const labels = {
    tossup: "Toss-up",
    competitive: "Competitive",
    lean: "Lean",
    likely: "Likely",
    safe: "Safe",
    uncontested: "Uncontested",
    unknown: "No data"
  };
  return labels[category] || "No data";
}

function competitivenessColor(category) {
  const colors = {
    tossup: partyColors.TOSSUP,
    competitive: partyColors.COMPETITIVE,
    lean: partyColors.LEAN,
    likely: partyColors.LIKELY,
    safe: partyColors.SAFE,
    uncontested: partyColors.UNCONTESTED,
    unknown: "#e5e7eb"
  };
  return colors[category] || "#e5e7eb";
}

function competitivenessDefinition(category) {
  const definitions = {
    tossup: "winner margin below 5 percentage points",
    competitive: "winner margin from 5 to under 10 percentage points",
    lean: "winner margin from 10 to under 20 percentage points",
    likely: "winner margin from 20 to under 35 percentage points",
    safe: "winner margin of 35 percentage points or more",
    uncontested: "only one major vote-getting candidate; no meaningful two-candidate contest"
  };
  return definitions[category] || "";
}

function partyLabel(code) {
  return partyNames[code] || code || "Other";
}

function partyColor(code) {
  return partyColors[code] || partyColors.OTHER;
}

function racesForSelection() {
  const prefix = `${state.chamber}|${state.year}|`;
  return Object.entries(raceData)
    .filter(([key]) => key.startsWith(prefix))
    .map(([, race]) => race)
    .sort((a, b) => Number(a.district_number) - Number(b.district_number));
}

function formatDistrictLabel(race) {
  if (!race) return "N/A";
  return `${race.chamber} District ${race.district_number}`;
}

function candidateRows(race) {
  const candidates = race.candidates || [];
  if (!candidates.length) return "";
  return candidates.map(c => `
    <tr>
      <td>${c.name || ""}</td>
      <td>${c.party || ""}</td>
      <td style="text-align:right;">${c.votes || ""}</td>
      <td style="text-align:right;">${c.pct || ""}</td>
    </tr>
  `).join("");
}

function popupHtml(race) {
  if (!race) return "<strong>No race data found</strong>";
  return `
    <div style="min-width:270px;">
      <h3 style="margin:0 0 6px 0;">${race.chamber} District ${race.district_number}</h3>
      <div><strong>Winner:</strong> ${race.winner_candidate || ""} (${partyLabel(race.winner_party)})</div>
      <div><strong>Total votes:</strong> ${race.district_total_votes || "N/A"}</div>
      <div><strong>Margin:</strong> ${race.margin_votes || "N/A"} votes (${race.margin_pct || "N/A"})</div>
      <div><strong>Status:</strong> ${race.is_uncontested ? "Uncontested" : "Contested"}</div>
      <table style="width:100%; margin-top:8px; border-collapse:collapse; font-size:12px;">
        <thead>
          <tr>
            <th style="text-align:left; border-bottom:1px solid #ddd;">Candidate</th>
            <th style="text-align:left; border-bottom:1px solid #ddd;">Party</th>
            <th style="text-align:right; border-bottom:1px solid #ddd;">Votes</th>
            <th style="text-align:right; border-bottom:1px solid #ddd;">%</th>
          </tr>
        </thead>
        <tbody>${candidateRows(race)}</tbody>
      </table>
    </div>
  `;
}

function styleFeature(feature) {
  const district = getFeatureDistrict(feature);
  const race = getRace(state.chamber, state.year, district);
  const genderRecord = typeof getGenderRecord === "function" ? getGenderRecord(state.chamber, state.year, district) : null;

  let stroke = "#334155";
  let fill = "#ffffff";
  let fillOpacity = 0.30;
  let weight = 1.25;

  if (state.view === "gender") {
    if (genderRecord && genderRecord.is_woman === true) {
      stroke = partyColors.WOMAN_STROKE;
      fill = partyColors.WOMAN;
      fillOpacity = 0.72;
      weight = 1.8;
    } else {
      stroke = "#9ca3af";
      fill = "#d1d5db";
      fillOpacity = 0.20;
    }
  } else if (state.view === "competitiveness") {
    const category = competitivenessCategory(race);
    const isSelected = state.competitivenessFilter === "all" || state.competitivenessFilter === category;
    fill = competitivenessColor(category);
    stroke =
      category === "uncontested" ? "#475569" :
      category === "unknown" ? "#cbd5e1" :
      "#334155";
    fillOpacity =
      !isSelected ? 0.08 :
      category === "unknown" ? 0.12 :
      category === "safe" ? 0.42 :
      category === "uncontested" ? 0.46 :
      0.74;
    weight =
      !isSelected ? 0.75 :
      category === "tossup" || category === "competitive" ? 2.0 :
      category === "uncontested" ? 1.5 :
      1.25;
    if (!isSelected) {
      stroke = "#cbd5e1";
    }
  } else if (race) {
    if (state.view === "party") {
      stroke = partyColor(race.winner_party);
      fill = partyColor(race.winner_party);
      fillOpacity = 0.34;
    } else if (state.view === "uncontested") {
      if (race.is_uncontested) {
        stroke = partyColor(race.winner_party);
        fill = partyColor(race.winner_party);
        fillOpacity = 0.36;
      } else {
        stroke = "#64748b";
        fill = "#ffffff";
        fillOpacity = 0.22;
      }
    }
  }

  return {
    color: stroke,
    weight,
    opacity: 1,
    fillColor: fill,
    fillOpacity
  };
}

function showRace(race, lyr) {
  if (!race || !lyr) return;
  if (selectedLayer && selectedLayer !== lyr && layer) {
    layer.resetStyle(selectedLayer);
  }
  selectedLayer = lyr;
  selectedKey = `${state.chamber}|${state.year}|${race.district_number}`;
  lyr.setStyle({ weight: 4, color: "#0f172a", fillOpacity: 0.58 });
  lyr.bindPopup(popupHtml(race)).openPopup();
  highlightDistrictList();
}

function onEachFeature(feature, lyr) {
  const district = getFeatureDistrict(feature);
  const race = getRace(state.chamber, state.year, district);
  const key = `${state.chamber}|${state.year}|${district}`;
  featureLayerByKey[key] = lyr;

  const label = race
    ? `${race.chamber} District ${race.district_number}: ${race.winner_candidate} (${race.winner_party})`
    : `District ${district}`;

  lyr.bindTooltip(label, { sticky: true });
  lyr.on("click", () => showRace(race, lyr));
}

function renderSeatChart(partyCounts, totalSeats) {
  const svg = document.getElementById("seatChart");
  const labels = document.getElementById("seatLabels");
  if (!svg || !labels || !totalSeats) return;

  const parties = Object.entries(partyCounts)
    .filter(([, count]) => count > 0)
    .sort((a, b) => {
      const order = { DEM: 1, REP: 2, IND: 3, LIB: 4, MOD: 5 };
      return (order[a[0]] || 9) - (order[b[0]] || 9);
    });

  const cx = 120, cy = 112, rOuter = 88, rInner = 52;
  let startDeg = 180;
  let paths = "";

  function pt(r, deg) {
    const rad = deg * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }

  function segment(a0, a1, color) {
    const [x1, y1] = pt(rOuter, a0);
    const [x2, y2] = pt(rOuter, a1);
    const [x3, y3] = pt(rInner, a1);
    const [x4, y4] = pt(rInner, a0);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return `<path d="M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 ${large} 0 ${x4} ${y4} Z" fill="${color}" stroke="#fff" stroke-width="2"></path>`;
  }

  parties.forEach(([party, count]) => {
    const span = (count / totalSeats) * 180;
    const endDeg = startDeg + span;
    paths += segment(startDeg, endDeg, partyColor(party));
    startDeg = endDeg;
  });

  const dem = partyCounts.DEM || 0;
  const rep = partyCounts.REP || 0;
  const other = totalSeats - dem - rep;

  svg.innerHTML = `
    ${paths}
    <text x="120" y="90" text-anchor="middle" font-size="24" font-weight="900" fill="#0f172a">${totalSeats}</text>
    <text x="120" y="107" text-anchor="middle" font-size="11" fill="#64748b">seats</text>
  `;
  labels.innerHTML = `
    <div><span class="seat-count">${dem}</span>Dem</div>
    <div style="text-align:center;"><span class="seat-count">${other}</span>Other</div>
    <div style="text-align:right;"><span class="seat-count">${rep}</span>Rep</div>
  `;
}





function selectRaceByDistrict(districtNumber) {
  let targetLayer = null;
  map.eachLayer(layer => {
    if (layer.feature && Number(getFeatureDistrict(layer.feature)) === Number(districtNumber)) {
      targetLayer = layer;
    }
  });
  if (targetLayer) {
    selectedLayer = targetLayer;
    targetLayer.setStyle({ weight: 3.2, color: "#111827" });
    map.fitBounds(targetLayer.getBounds(), { padding: [40, 40] });
    const race = getRace(state.chamber, state.year, districtNumber);
    if (race) {
      showRace(race, targetLayer);
    }
  }
}

function renderCompetitivenessOverlay(races) {

  const contested = races.filter(r => !r.is_uncontested);
  const categories = {

    competitive: contested.filter(r => competitivenessCategory(r) === "competitive").length,
    lean: contested.filter(r => competitivenessCategory(r) === "lean").length,
    likely: contested.filter(r => competitivenessCategory(r) === "likely").length,
    safe: contested.filter(r => competitivenessCategory(r) === "safe").length,
    uncontested: races.filter(r => r.is_uncontested).length
  };

  const competitiveUnder10 = categories.tossup + categories.competitive;
  const competitivePct = races.length ? ((competitiveUnder10 / races.length) * 100).toFixed(1) + "%" : "N/A";

  const avgMargins = contested
    .map(r => Math.abs(parseNumber(r.margin_pct)))
    .filter(v => !Number.isNaN(v));
  const avgMargin = avgMargins.length
    ? (avgMargins.reduce((a, b) => a + b, 0) / avgMargins.length).toFixed(1) + "%"
    : "N/A";

  const closest = contested
    .map(r => ({ race: r, margin: Math.abs(parseNumber(r.margin_pct)) }))
    .filter(x => !Number.isNaN(x.margin))

        <div class="gender-label">Competitive seats</div>

        <div class="gender-detail">margin below 10 pts.</div>
      </div>
      <div class="gender-mini-card">
        <div class="gender-label">Competitive seats of all seats in %</div>
        <div class="gender-value">${competitivePct}</div>
        <div class="gender-detail">share of chamber</div>
      </div>
    </div>

    <div class="gender-stat-main">
      <div class="gender-mini-card">

function renderDistrictList() {
  const query = document.getElementById("districtSearch").value.toLowerCase().trim();
  const races = racesForSelection();
  const filtered = races.filter(r => {
    const haystack = [
      r.district_number,
      r.winner_candidate,
      r.winner_party,
      r.margin_votes,
      r.margin_pct,
      ...(r.candidates || []).map(c => `${c.name} ${c.party} ${c.votes} ${c.pct}`)
    ].join(" ").toLowerCase();
    return !query || haystack.includes(query);
  });

  const list = document.getElementById("districtList");
  list.innerHTML = filtered.map(r => {
    const key = `${state.chamber}|${state.year}|${r.district_number}`;
    const uncontested = r.is_uncontested ? " · Uncontested" : "";
    const genderRecord = getGenderRecord(state.chamber, state.year, r.district_number);
    const isWoman = genderRecord && genderRecord.is_woman === true;
    const leftColor = state.view === "gender" && isWoman ? partyColors.WOMAN : partyColor(r.winner_party);
    const genderText = isWoman ? " · Woman-held seat" : "";
    const compCategory = competitivenessCategory(r);
    const compText = state.view === "competitiveness" ? ` · ${competitivenessLabel(compCategory)}` : "";
    return `
      <div class="district-item" data-key="${key}" style="border-left-color:${state.view === "competitiveness" ? competitivenessColor(compCategory) : leftColor}">
        <div class="district-item-top">
          <span>${partyLabel(r.winner_party)}</span>
          <span>District ${r.district_number}</span>
        </div>
        <div class="district-item-name">${r.winner_candidate}</div>
        <div class="district-item-detail">Margin: ${r.margin_votes || "N/A"} votes (${r.margin_pct || "N/A"})${uncontested}${genderText}${compText}</div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".district-item").forEach(el => {
    el.addEventListener("click", () => {
      const lyr = featureLayerByKey[el.dataset.key];
      const race = raceData[el.dataset.key];
      if (lyr && race) {
        map.fitBounds(lyr.getBounds(), { padding: [30, 30], maxZoom: 12 });
        showRace(race, lyr);
      }
    });
  });

  highlightDistrictList();
}

  syncButtons();
  const isFocus = state.view === "gender" || state.view === "competitiveness" || state.view === "uncontested";
  document.body.classList.toggle("focus-view", isFocus);
  document.body.classList.toggle("focus-mode", isFocus);
  document.body.classList.toggle("gender-mode", isFocus);
  const sharedOverlay = document.getElementById("genderOverlay");
  if (!isFocus && sharedOverlay) sharedOverlay.innerHTML = "";
  setTimeout(() => map.invalidateSize(), 50);
  selectedLayer = null;
  selectedKey = null;
  featureLayerByKey = {};

  const geo = geojsons[getGeoKey(state.chamber, state.year)];
  if (!geo) {
    document.getElementById("districtList").innerHTML = `<div class="error">Missing GeoJSON for ${state.chamber} ${state.year}.</div>`;
    return;
  }

  if (layer) map.removeLayer(layer);
  layer = L.geoJSON(geo, {
    style: styleFeature,
    onEachFeature
  }).addTo(map);

  setTimeout(() => map.invalidateSize(), 0);
  map.fitBounds(layer.getBounds(), { padding: [15, 15] });
  addLegend();
  updateEraBadge();
  updateOverview();
renderDistrictList();
}

async function fetchJson(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error(`${url} returned ${response.status}`);
  return response.json();
}

async function loadData() {
  const files = {
    senate_old: "data/senate_old.geojson",
    house_old: "data/house_old.geojson",
    senate_new: "data/senate_new.geojson",
    house_new: "data/house_new.geojson"
  };

  const geoEntries = await Promise.all(
    Object.entries(files).map(async ([key, url]) => [key, await fetchJson(url)])
  );

  geojsons = Object.fromEntries(geoEntries);
  raceData = await fetchJson("data/race_data.json");
}

<script>
(function () {
  function byId(id) {
    return document.getElementById(id);
  }

  function normalizePartyValue(value) {
    return String(value || "OTHER").trim().toUpperCase();
  }

  function formatMarginText(race) {
    const margin = Number.parseFloat(race?.margin_pct);
    if (Number.isFinite(margin) && margin > 0) {
      return `${(margin * 100).toFixed(1)}% margin`;
    }
    return race?.is_uncontested ? "Uncontested" : "Tap a district";
  }

  function currentRaceSummary() {
    const races = typeof racesForSelection === "function" ? racesForSelection() : [];
    const counts = races.reduce((acc, race) => {
      const party = normalizePartyValue(race.winner_party);
      acc.total += 1;
      if (party === "DEM") acc.dem += 1;
      else if (party === "REP") acc.rep += 1;
      else acc.other += 1;
      return acc;
    }, { total: 0, dem: 0, rep: 0, other: 0 });
    return counts;
  }

  function renderMobileResults(race) {
    const card = byId("mobileResults");
    if (!card) return;

    const kicker = card.querySelector(".mobile-results-kicker");
    const meta = card.querySelector(".mobile-results-meta");
    const dem = byId("mobileDemScore");
    const rep = byId("mobileRepScore");
    const total = byId("mobileTotalSeats");
    const chamberLabel = state.chamber === "house" ? "House" : "Senate";
    const summary = currentRaceSummary();

    if (race) {
      const party = normalizePartyValue(race.winner_party);
      kicker.textContent = `District ${race.district_number}`;
      meta.textContent = `${race.winner_candidate || "Winner unavailable"} · ${party}`;
      total.textContent = formatMarginText(race);
    } else {
      kicker.textContent = "Rhode Island";
      meta.textContent = `${chamberLabel} · ${state.year}`;
      total.textContent = summary.total ? `${summary.total} total seats` : "Tap a district";
    }

    dem.textContent = summary.dem;
    rep.textContent = summary.rep;

    const share = summary.total ? summary.dem / summary.total : 0.5;
    card.style.setProperty("--dem-angle", `${Math.max(0, Math.min(180, share * 180))}deg`);
  }

  function bindMenuToggle() {
    const toggle = byId("menuToggle");
    const nav = byId("siteNav");
    if (!toggle || !nav || toggle.dataset.bound === "1") return;

    toggle.dataset.bound = "1";
    toggle.addEventListener("click", () => {
      const next = !document.body.classList.contains("nav-open");
      document.body.classList.toggle("nav-open", next);
      toggle.setAttribute("aria-expanded", String(next));
    });

    nav.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        document.body.classList.remove("nav-open");
        toggle.setAttribute("aria-expanded", "false");
      });
    });
  }

  function bindMobileYearSelect() {
    const yearSelect = byId("mobileYearSelect");
    if (!yearSelect || yearSelect.dataset.bound === "1") return;

    yearSelect.dataset.bound = "1";
    yearSelect.value = state.year;
    yearSelect.addEventListener("change", event => {
      state.year = event.target.value;
      refresh();
    });
  }

  const originalSyncButtons = syncButtons;
  syncButtons = function () {
    originalSyncButtons();
    const yearSelect = byId("mobileYearSelect");
    if (yearSelect && yearSelect.value !== state.year) {
      yearSelect.value = state.year;
    }
  };

  const originalSetupControls = setupControls;
  setupControls = function () {
    originalSetupControls();
    bindMobileYearSelect();
    bindMenuToggle();
  };

  const originalShowRace = showRace;
  showRace = function (race, lyr) {
    originalShowRace(race, lyr);
    renderMobileResults(race);

    if (
      race &&
      lyr &&
      window.matchMedia("(max-width: 760px)").matches &&
      typeof lyr.getBounds === "function"
    ) {
      map.fitBounds(lyr.getBounds(), { padding: [30, 30], maxZoom: 12 });
    }
  };

  const originalRefresh = refresh;
  refresh = function () {
    originalRefresh();
    setTimeout(() => {
      renderMobileResults();
      map.invalidateSize();
    }, 90);
  };

  bindMenuToggle();
  bindMobileYearSelect();
  renderMobileResults();
})();
</script>
</body>
</html>
