name: Apply 2026 post-primary transition

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_post_primary_2026.py'
      - 'post-primary-2026.js'
      - '.github/workflows/apply-post-primary-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply primary results to candidate data and pages
        run: python scripts/apply_post_primary_2026.py
      - name: Commit post-primary changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/whos_running_2026.json data/post_primary_status_2026.json running.html ballot.html index.html
          if git diff --cached --quiet; then
            echo 'No post-primary changes to commit.'
          else
            git commit -m 'Apply September 2026 primary results to candidate experience'
            git push
          fi
