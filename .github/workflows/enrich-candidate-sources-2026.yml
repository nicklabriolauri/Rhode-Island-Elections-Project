name: Enrich 2026 candidate sources
on:
  push:
    paths:
      - 'scripts/enrich_candidate_sources_2026.py'
      - '.github/workflows/enrich-candidate-sources-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified websites priorities and endorsements
        run: python scripts/enrich_candidate_sources_2026.py
      - name: Commit enrichment
        run: |
          git config user.name "nicklabriolauri"
          git config user.email "nicholas.labriola@uri.edu"
          git add data/candidate_research_2026.json data/candidate_research_2026_with_endorsements.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enrich verified 2026 candidate sources"
          git push
