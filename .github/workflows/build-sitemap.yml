name: Build sitemap
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_sitemap.py'
      - 'data/whos_running_2026.json'
      - 'data/primary_results_2026.json'
      - 'races/**'
      - '.github/workflows/build-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_sitemap.py
      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "Refresh sitemap"
          git push
