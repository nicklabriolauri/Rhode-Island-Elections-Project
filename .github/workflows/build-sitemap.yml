name: Build candidate SEO and sitemap
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_sitemap.py'
      - 'scripts/build_candidate_seo.py'
      - 'candidates/**'
      - 'candidate-profiles.html'
      - 'data/whos_running_2026.json'
      - 'data/primary_results_2026.json'
      - 'races/**'
      - '.github/workflows/build-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: candidate-search-metadata
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_candidate_seo.py
      - run: python scripts/build_sitemap.py
      - name: Commit candidate search metadata and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates/*.html candidate-profiles.html sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh candidate search metadata and sitemap"
          git pull --rebase origin main
          git push
