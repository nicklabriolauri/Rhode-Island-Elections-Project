name: Refresh mobile voter guide
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/whos_running_2026.json'
      - 'data/candidate_profiles_2026.json'
      - 'data/candidate_research_2026_with_endorsements.json'
      - 'data/candidate_finance_2026.json'
      - 'data/race_ratings_2026.json'
      - 'data/bffi_ratings_2026.json'
      - 'scripts/bffi_scorecards.py'
      - 'scripts/build_bffi_scorecards.py'
      - 'scripts/candidate_profile_components.py'
      - 'candidates/**'
      - 'scripts/build_mobile_guide.py'
      - '.github/workflows/build-mobile-guide.yml'
permissions:
  contents: write
concurrency:
  group: mobile-guide-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_bffi_scorecards.py
      - run: python scripts/test_bffi_scorecards.py
      - run: python scripts/build_mobile_guide.py
      - name: Publish refreshed source bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mobile_guide_2026.json candidates/*.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh mobile voter guide data'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1

