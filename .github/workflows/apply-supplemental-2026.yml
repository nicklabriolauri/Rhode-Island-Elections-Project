name: Apply 2026 supplemental candidate updates
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_supplemental_2026.py'
      - 'supplemental-2026.js'
      - 'data/independent_finance_supplement_2026.json'
      - '.github/workflows/apply-supplemental-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch candidate search and finance displays
        run: python scripts/apply_supplemental_2026.py
      - name: Commit supplemental page changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html running.html ballot.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show candidate status in search and independent finance summaries'
          git push
