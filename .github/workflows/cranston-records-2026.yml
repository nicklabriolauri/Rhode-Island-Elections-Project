name: Import Cranston 2026 council records
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_cranston_2026.py'
      - 'scripts/build_cranston_records.py'
      - 'scripts/publish_cranston_profile_records.py'
      - 'data/cranston/records-2026/review-overrides.json'
      - '.github/workflows/cranston-records-2026.yml'
permissions:
  contents: write
concurrency:
  group: cranston-records-2026
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install public-document readers
        run: |
          python -m pip install pymupdf beautifulsoup4
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
      - name: Collect public source indexes
        run: python scripts/collect_cranston_2026.py
      - name: Build and validate council records
        run: |
          python scripts/build_cranston_records.py
          python scripts/publish_cranston_profile_records.py
          python scripts/test_cranston_records.py
          python scripts/export_cranston_records_csv.py
      - name: Save source inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cranston/records-2026 candidates/andy-m-andujar.html candidates/avery-therese-mangahas.html candidates/daniel-robert-wall.html candidates/frank-j-ritz-jr.html candidates/michael-a-traficante.html candidates/sara-jane-haupt.html candidates/emilia-vaziri.html candidates/kristen-e-haroian.html candidates/steven-a-stycos.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Collect public Cranston council source inventory'
          git pull --rebase origin main
          git push

