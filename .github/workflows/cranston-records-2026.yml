name: Import Cranston 2026 council records
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_cranston_2026.py'
      - 'scripts/build_cranston_records.py'
      - 'scripts/publish_cranston_profile_records.py'
      - 'data/cranston/records-2026/review-overrides.json'
      - '.github/workflows/cranston-records-2026.yml'
permissions:
  contents: write
concurrency:
  group: cranston-records-2026
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install public-document readers
        run: |
          python -m pip install pymupdf beautifulsoup4
          if ! command -v tesseract >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr; fi
      - name: Collect public source indexes
        run: python scripts/collect_cranston_2026.py
      - name: Build and validate council records
        run: |
          python scripts/build_cranston_records.py
          python scripts/publish_cranston_profile_records.py
          python scripts/test_cranston_records.py
          python scripts/export_cranston_records_csv.py
      - name: Save sources and rebuild against the latest repository files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cranston_cache=$(mktemp -d)
          cp data/cranston/records-2026/sources.json "$cranston_cache/"
          cp data/cranston/records-2026/source-indexes.json "$cranston_cache/"
          cp -a data/cranston/records-2026/originals "$cranston_cache/"
          if [ -d data/cranston/records-2026/previous-versions ]; then cp -a data/cranston/records-2026/previous-versions "$cranston_cache/"; fi
          for attempt in 1 2 3; do
            git fetch origin main
            # This is an ephemeral Actions checkout. Public source bytes were backed up above.
            # Rebuild on the latest profile HTML so other edits and human overrides survive.
            git reset --hard origin/main
            mkdir -p data/cranston/records-2026
            cp "$cranston_cache/sources.json" "$cranston_cache/source-indexes.json" data/cranston/records-2026/
            cp -a "$cranston_cache/originals/." data/cranston/records-2026/originals/
            if [ -d "$cranston_cache/previous-versions" ]; then mkdir -p data/cranston/records-2026/previous-versions; cp -a "$cranston_cache/previous-versions/." data/cranston/records-2026/previous-versions/; fi
            python scripts/build_cranston_records.py
            python scripts/publish_cranston_profile_records.py
            python scripts/test_cranston_records.py
            python scripts/export_cranston_records_csv.py
            git add data/cranston/records-2026 candidates/andy-m-andujar.html candidates/avery-therese-mangahas.html candidates/daniel-robert-wall.html candidates/frank-j-ritz-jr.html candidates/michael-a-traficante.html candidates/sara-jane-haupt.html candidates/emilia-vaziri.html candidates/kristen-e-haroian.html candidates/steven-a-stycos.html
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh Cranston 2026 council sources, votes and attendance'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
