name: Update 2026 Primary Results

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes. The script itself only runs during the configured election window.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: primary-results-update
  cancel-in-progress: true

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch official Rhode Island primary results
        env:
         RI_RESULTS_URL: "https://electionresults.ri.gov/results/public/RhodeIsland/elections/RI2026StatewidePrimary?cg=General%20Assembly"
          # Scheduled runs outside this window exit without changing files.
          ELECTION_START: "2026-09-09T19:45:00-04:00"
          ELECTION_END: "2026-09-10T02:00:00-04:00"
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/update_primary_results_2026.py

      - name: Commit updated results
        run: |
          if git diff --quiet -- data/primary_results_2026.json; then
            echo "No result changes."
            exit 0
          fi

          git config user.name "RIEP Results Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/primary_results_2026.json
          git commit -m "Update 2026 primary results"
          git push
