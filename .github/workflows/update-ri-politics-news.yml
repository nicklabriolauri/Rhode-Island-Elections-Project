name: Update RI Politics News

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-news-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Rhode Island politics feed
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html import unescape
          from pathlib import Path
          from urllib.parse import quote_plus
          from urllib.request import Request, urlopen

          QUERY = "Rhode Island politics"
          FEED_URL = (
              "https://news.google.com/rss/search?"
              f"q={quote_plus(QUERY)}&hl=en-US&gl=US&ceid=US:en"
          )
          OUTPUT = Path("data/ri_politics_news.json")
          MAX_ITEMS = 5
          MAX_ARCHIVE_ITEMS = 60

          SOURCE_FEEDS = [
              {
                  "url": "https://rhodeislandcurrent.com/tag/primary-2026-races-to-watch/feed/",
                  "source": "Rhode Island Current",
                  "topic": "Primary 2026: Races to watch",
              },
          ]

          PREFERRED_SOURCES = [
              "Rhode Island Current",
              "The Providence Journal",
              "Providence Journal",
              "WPRI.com",
              "WPRI 12",
              "NBC 10 WJAR",
              "The Boston Globe",
              "GoLocalProv",
              "Ocean State Media",
          ]
          ALLOWED_SOURCE_TOKENS = (
              "Rhode Island Current",
              "Providence Journal",
              "WPRI",
              "NBC 10",
              "Boston Globe",
              "GoLocalProv",
              "Ocean State Media",
          )

          def clean_text(value: str) -> str:
              value = unescape(value or "")
              value = re.sub(r"<[^>]+>", "", value)
              value = re.sub(r"\s+", " ", value).strip()
              return value

          def extract_source_and_title(raw_title: str) -> tuple[str, str]:
              title = clean_text(raw_title)
              for separator in (" - ", " | ", " — "):
                  if separator in title:
                      head, tail = title.rsplit(separator, 1)
                      if tail:
                          return tail.strip(), head.strip()
              return "", title

          def source_allowed(source: str) -> bool:
              return any(token.lower() in source.lower() for token in ALLOWED_SOURCE_TOKENS)

          def parse_pubdate(raw: str) -> str:
              try:
                  return parsedate_to_datetime(raw).astimezone(timezone.utc).isoformat()
              except Exception:
                  return ""

          def display_date(iso_value: str) -> str:
              if not iso_value:
                  return ""
              try:
                  dt = datetime.fromisoformat(iso_value)
                  return dt.strftime("%b ") + str(dt.day)
              except Exception:
                  return ""

          def normalize_source_rank(source: str) -> int:
              if source in PREFERRED_SOURCES:
                  return PREFERRED_SOURCES.index(source)
              return len(PREFERRED_SOURCES) + 1

          def fetch_xml(url: str) -> ET.Element:
              request = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(request, timeout=20) as response:
                  return ET.fromstring(response.read())

          def make_item(
              *,
              title: str,
              source: str,
              url: str,
              published: str,
              summary: str,
              topic: str = "",
          ) -> dict:
              item = {
                  "title": clean_text(title),
                  "source": clean_text(source),
                  "url": url or "",
                  "published": published,
                  "displayDate": display_date(published),
                  "summary": clean_text(summary) or clean_text(title),
              }
              if topic:
                  item["topic"] = topic
              return item

          def collect_google_items() -> list[dict]:
              root = fetch_xml(FEED_URL)
              items = []
              for node in root.findall("./channel/item"):
                  source, title = extract_source_and_title(node.findtext("title", ""))
                  if not source_allowed(source):
                      continue
                  published = parse_pubdate(node.findtext("pubDate", ""))
                  items.append(
                      make_item(
                          title=title,
                          source=source,
                          url=node.findtext("link", ""),
                          published=published,
                          summary=node.findtext("description", ""),
                      )
                  )
              items.sort(key=lambda item: item.get("published", ""), reverse=True)
              items.sort(key=lambda item: normalize_source_rank(item.get("source", "")))
              return items

          def collect_source_items() -> list[dict]:
              items = []
              for feed in SOURCE_FEEDS:
                  try:
                      root = fetch_xml(feed["url"])
                  except Exception as exc:
                      print(f"Could not load source feed {feed['url']}: {exc}")
                      continue

                  for node in root.findall("./channel/item"):
                      title = clean_text(node.findtext("title", ""))
                      if not title:
                          continue
                      published = parse_pubdate(node.findtext("pubDate", ""))
                      items.append(
                          make_item(
                              title=title,
                              source=feed["source"],
                              url=node.findtext("link", ""),
                              published=published,
                              summary=node.findtext("description", ""),
                              topic=feed.get("topic", ""),
                          )
                      )
              items.sort(key=lambda item: item.get("published", ""), reverse=True)
              return items

          def dedupe_items(items: list[dict]) -> list[dict]:
              seen = set()
              unique = []
              for item in items:
                  key = (item.get("url") or item.get("title", "")).strip().lower()
                  if not key or key in seen:
                      continue
                  seen.add(key)
                  unique.append(item)
              return unique

          source_items = collect_source_items()
          google_items = collect_google_items()
          combined = dedupe_items(source_items + google_items)

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          OUTPUT.write_text(
              json.dumps(
                  {
                      "updated": datetime.now(timezone.utc).isoformat(),
                      "query": QUERY,
                      "source": "Google News RSS plus selected Rhode Island politics source feeds",
                      "items": combined[:MAX_ITEMS],
                      "archive": combined[:MAX_ARCHIVE_ITEMS],
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )
          print(
              f"Wrote {len(combined[:MAX_ITEMS])} current items and "
              f"{len(combined[:MAX_ARCHIVE_ITEMS])} archived items to {OUTPUT}"
          )
          PY

      - name: Commit updated feed
        shell: bash
        run: |
          if git diff --quiet -- data/ri_politics_news.json; then
            echo "No news changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ri_politics_news.json
            git commit -m "Update RI politics news feed"
            git push
          fi
