name: Update RI Politics News

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-news-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Rhode Island politics feed
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html import unescape
          from pathlib import Path
          from urllib.parse import quote_plus
          from urllib.request import Request, urlopen

          QUERY = "Rhode Island politics"
          FEED_URL = (
              "https://news.google.com/rss/search?"
              f"q={quote_plus(QUERY)}&hl=en-US&gl=US&ceid=US:en"
          )

          OUTPUT = Path("data/ri_politics_news.json")
          MAX_ITEMS = 5
          MAX_ARCHIVE_ITEMS = 60
          CURATED_HOMEPAGE_LIMIT = 1
          PER_SOURCE_HOMEPAGE_LIMIT = 2

          SOURCE_FEEDS = [
              {
                  "url": "https://rhodeislandcurrent.com/tag/primary-2026-races-to-watch/feed/",
                  "source": "Rhode Island Current",
                  "topic": "Primary 2026: Races to watch",
              },
          ]

          PREFERRED_SOURCES = [
              "Rhode Island Current",
              "The Providence Journal",
              "Providence Journal",
              "WPRI.com",
              "WPRI 12",
              "NBC 10 WJAR",
              "The Boston Globe",
              "GoLocalProv",
              "Ocean State Media",
          ]

          ALLOWED_SOURCE_TOKENS = (
              "Rhode Island Current",
              "Providence Journal",
              "WPRI",
              "NBC 10",
              "WJAR",
              "Boston Globe",
              "GoLocalProv",
              "Ocean State Media",
          )

          def clean_text(value: str) -> str:
              value = unescape(value or "")
              value = re.sub(r"<[^>]+>", "", value)
              value = re.sub(r"\s+", " ", value).strip()
              return value

          def extract_source_and_title(raw_title: str) -> tuple[str, str]:
              title = clean_text(raw_title)
              for separator in (" - ", " | ", " — "):
                  if separator in title:
                      head, tail = title.rsplit(separator, 1)
                      if tail:
                          return tail.strip(), head.strip()
              return "", title

          def source_allowed(source: str) -> bool:
              return any(token.lower() in source.lower() for token in ALLOWED_SOURCE_TOKENS)

          def parse_pubdate(raw: str) -> str:
              try:
                  return parsedate_to_datetime(raw).astimezone(timezone.utc).isoformat()
              except Exception:
                  return ""

          def fetch_rss(url: str) -> ET.Element:
              request = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(request, timeout=20) as response:
                  return ET.fromstring(response.read())

          def parse_item(item: ET.Element, fallback_source: str = "", topic: str = "", curated: bool = False) -> dict:
              raw_title = item.findtext("title", "")
              source, title = extract_source_and_title(raw_title)

              if fallback_source:
                  source = fallback_source

              return {
                  "title": title,
                  "source": source,
                  "summary": clean_text(item.findtext("description", "")),
                  "link": clean_text(item.findtext("link", "")),
                  "published": parse_pubdate(item.findtext("pubDate", "")),
                  "topic": topic,
                  "curated": curated,
              }

          def dedupe_articles(items: list[dict]) -> list[dict]:
              seen = set()
              deduped = []

              for article in items:
                  key = (article.get("link") or article.get("title") or "").strip().lower()
                  if not key or key in seen:
                      continue
                  seen.add(key)
                  deduped.append(article)

              return deduped

          def sort_articles(items: list[dict]) -> list[dict]:
              def source_rank(source: str) -> int:
                  if source in PREFERRED_SOURCES:
                      return PREFERRED_SOURCES.index(source)
                  return len(PREFERRED_SOURCES)

              return sorted(
                  items,
                  key=lambda article: (
                      article.get("published") or "",
                      -source_rank(article.get("source", "")),
                  ),
                  reverse=True,
              )

          def select_homepage_items(items: list[dict]) -> list[dict]:
              selected = []
              deferred = []
              source_counts = {}
              curated_count = 0
              seen = set()

              for article in items:
                  key = (article.get("link") or article.get("title") or "").strip().lower()
                  if not key or key in seen:
                      continue

                  source = article.get("source", "")

                  if article.get("curated") and curated_count >= CURATED_HOMEPAGE_LIMIT:
                      deferred.append(article)
                      continue

                  if source_counts.get(source, 0) >= PER_SOURCE_HOMEPAGE_LIMIT:
                      deferred.append(article)
                      continue

                  selected.append(article)
                  seen.add(key)
                  source_counts[source] = source_counts.get(source, 0) + 1

                  if article.get("curated"):
                      curated_count += 1

                  if len(selected) >= MAX_ITEMS:
                      return selected

              for article in deferred:
                  key = (article.get("link") or article.get("title") or "").strip().lower()
                  if not key or key in seen:
                      continue

                  selected.append(article)
                  seen.add(key)

                  if len(selected) >= MAX_ITEMS:
                      break

              return selected

          articles = []

          try:
              google_root = fetch_rss(FEED_URL)
              for item in google_root.findall("./channel/item"):
                  article = parse_item(item)
                  if article["title"] and article["link"] and source_allowed(article["source"]):
                      articles.append(article)
          except Exception as exc:
              print(f"Google News RSS fetch failed: {exc}")

          for feed in SOURCE_FEEDS:
              try:
                  source_root = fetch_rss(feed["url"])
                  for item in source_root.findall("./channel/item"):
                      article = parse_item(
                          item,
                          fallback_source=feed["source"],
                          topic=feed["topic"],
                          curated=True,
                      )
                      if article["title"] and article["link"]:
                          articles.append(article)
              except Exception as exc:
                  print(f"Curated feed fetch failed for {feed['url']}: {exc}")

          articles = sort_articles(dedupe_articles(articles))

          payload = {
              "query": QUERY,
              "source": "Google News RSS plus curated Rhode Island Current feed",
              "source_url": FEED_URL,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "items": select_homepage_items(articles),
              "archive": articles[:MAX_ARCHIVE_ITEMS],
          }

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          OUTPUT.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n")

          print(f"Wrote {len(payload['items'])} homepage items and {len(payload['archive'])} archive items to {OUTPUT}")
          PY

      - name: Commit updated feed
        shell: bash
        run: |
          if git diff --quiet -- data/ri_politics_news.json; then
            echo "No news feed changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ri_politics_news.json
          git commit -m "Update RI politics news feed"
          git push
