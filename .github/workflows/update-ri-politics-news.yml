name: Update RI Politics News

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-news-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Rhode Island politics feed
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html import unescape
          from pathlib import Path
          from urllib.parse import quote_plus
          from urllib.request import Request, urlopen

          QUERY = "Rhode Island politics"
          FEED_URL = (
              "https://news.google.com/rss/search?"
              f"q={quote_plus(QUERY)}&hl=en-US&gl=US&ceid=US:en"
          )
          OUTPUT = Path("data/ri_politics_news.json")
          MAX_ITEMS = 5
          PREFERRED_SOURCES = [
              "Rhode Island Current",
              "The Providence Journal",
              "Providence Journal",
              "WPRI.com",
              "WPRI 12",
              "NBC 10 WJAR",
              "The Boston Globe",
              "GoLocalProv",
              "Ocean State Media",
          ]
          ALLOWED_SOURCE_TOKENS = (
              "Rhode Island Current",
              "Providence Journal",
              "WPRI",
              "NBC 10",
              "Boston Globe",
              "GoLocalProv",
              "Ocean State Media",
          )

          def clean_text(value: str) -> str:
              value = unescape(value or "")
              value = re.sub(r"<[^>]+>", "", value)
              value = re.sub(r"\s+", " ", value).strip()
              return value

          def extract_source_and_title(raw_title: str) -> tuple[str, str]:
              title = clean_text(raw_title)
              for separator in (" - ", " | ", " — "):
                  if separator in title:
                      head, tail = title.rsplit(separator, 1)
                      if tail:
                          return tail.strip(), head.strip()
              return "", title

          def source_allowed(source: str) -> bool:
              return any(token.lower() in source.lower() for token in ALLOWED_SOURCE_TOKENS)

          def parse_pubdate(raw: str) -> str:
              try:
                  return parsedate_to_datetime(raw).astimezone(timezone.utc).isoformat()
              except Exception:
                  return ""

          def normalize_source_rank(source: str) -> tuple[int, str]:
              if source in PREFERRED_SOURCES:
                  return (PREFERRED_SOURCES.index(source), source)
              return (len(PREFERRED_SOURCES) + 1, source)

          request = Request(
              FEED_URL,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/rss+xml,application/xml,text/xml,*/*",
              },
          )

          with urlopen(request, timeout=45) as response:
              xml_bytes = response.read()

          root = ET.fromstring(xml_bytes)
          channel = root.find("./channel")
          items = []

          if channel is not None:
              for item in channel.findall("item"):
                  raw_title = item.findtext("title", default="")
                  raw_link = item.findtext("link", default="")
                  raw_pub = item.findtext("pubDate", default="")
                  source, title = extract_source_and_title(raw_title)
                  if not title or not raw_link:
                      continue
                  if source and not source_allowed(source):
                      continue
                  items.append(
                      {
                          "title": title,
                          "url": raw_link.strip(),
                          "source": source or "Google News",
                          "published_at": parse_pubdate(raw_pub),
                      }
                  )

          deduped = []
          seen = set()
          for item in sorted(
              items,
              key=lambda entry: (normalize_source_rank(entry["source"]), entry["published_at"] or ""),
          ):
              key = (item["title"].lower(), item["source"].lower())
              if key in seen:
                  continue
              seen.add(key)
              deduped.append(item)

          deduped = sorted(
              deduped,
              key=lambda entry: entry["published_at"] or "",
              reverse=True,
          )[:MAX_ITEMS]

          payload = {
              "query": QUERY,
              "source_label": "Google News RSS",
              "source_url": FEED_URL,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "items": deduped,
          }

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          OUTPUT.write_text(json.dumps(payload, indent=2), encoding="utf-8")
          print(f"Wrote {len(deduped)} headlines to {OUTPUT}")
          PY

      - name: Commit updated news JSON
        shell: bash
        run: |
          if git diff --quiet -- data/ri_politics_news.json; then
            echo "No feed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ri_politics_news.json
          git commit -m "Update RI politics news feed"
          git push

