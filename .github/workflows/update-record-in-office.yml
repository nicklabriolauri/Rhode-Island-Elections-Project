name: Update Record in Office

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-record-in-office.yml"
      - "scripts/validate_incumbent_records.py"
      - "build_incumbent_records_2026.py"
      - "build_attendance_2025_2026.py"
      - "data/whos_running_2026.json"
      - "data/incumbent_records_2026.json"

permissions:
  contents: write

concurrency:
  group: update-record-in-office-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-records:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parsers
        run: pip install requests lxml pypdf

      - name: Build official bill statistics
        run: python build_incumbent_records_2026.py

      - name: Build official Journal attendance
        run: python build_attendance_2025_2026.py

      - name: Validate publishable data
        run: python scripts/validate_incumbent_records.py

      - name: Commit verified dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data/incumbent_records_2026.json data/attendance_sessions_2025_2026.json data/attendance_audit_2025_2026.json data/incumbent_records_2026_audit.json
            if git diff --cached --quiet; then
              echo "Verified incumbent records are already current."
              exit 0
            fi
            git commit -m "Update verified 2025-2026 incumbent records"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "Unable to publish incumbent records after three attempts."
              exit 1
            fi
            # This is a disposable runner checkout. Rebuild from the newest
            # inputs rather than overwriting concurrent profile/data updates.
            git fetch origin main
            git reset --hard origin/main
            python build_incumbent_records_2026.py
            python build_attendance_2025_2026.py
            python scripts/validate_incumbent_records.py
          done
